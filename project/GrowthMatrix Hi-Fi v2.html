<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GrowthMatrix — Hi-Fi v2 (functional)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --indigo: #4f46e5; }
  body { font-family: 'Inter', -apple-system, system-ui, sans-serif; }
  .dot { width: 9px; height: 9px; border-radius: 9999px; display: inline-block; }
  .dot-on { background: #4f46e5; }
  .dot-off { background: #e2e8f0; }
  .dot-target { border: 1.5px solid #4f46e5; background: transparent; }
  .dotbtn { padding: 3px; margin: -3px 0; border-radius: 9999px; cursor: pointer; line-height: 0; }
  .dotbtn:hover .dot-off { background: #a5b4fc; }
  .dotbtn:hover .dot-on { box-shadow: 0 0 0 2px #c7d2fe; }
  .skill-row:hover { background: #f8fafc; }
  .nav-item.active { background: #eef2ff; color: #3730a3; font-weight: 600; }
  .nav-item.active .nav-icon { color: #4f46e5; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .scroll-area::-webkit-scrollbar { width: 6px; height: 6px; }
  .scroll-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  .heatcell { width: 28px; height: 24px; border-radius: 4px; font-size: 10px; display: flex; align-items: center; justify-content: center; color: #1e293b; font-weight: 500; }
  .sim-track:active { cursor: grabbing; }
</style>
</head>
<body class="bg-slate-50 text-slate-900 text-sm">

<!-- Top bar -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-30">
  <div class="px-6 h-14 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold">G</div>
      <div class="font-semibold">GrowthMatrix</div>
      <span class="text-slate-300">/</span>
      <select class="text-sm bg-transparent border border-slate-200 rounded-md px-2 py-1">
        <option>Acme Corp</option>
      </select>
      <span class="text-slate-300">/</span>
      <select class="text-sm bg-transparent border border-slate-200 rounded-md px-2 py-1">
        <option>H1 2026 cycle</option>
        <option>H2 2025 cycle (closed)</option>
      </select>
    </div>
    <div class="flex items-center gap-2 text-sm">
      <button onclick="openCapture()" class="px-3 py-1.5 rounded-md text-slate-600 hover:bg-slate-100 flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
        Quick capture <kbd class="ml-1 text-[10px] bg-slate-100 px-1.5 py-0.5 rounded">⌘⇧L</kbd>
      </button>
      <button onclick="resetAll()" class="px-3 py-1.5 rounded-md text-slate-600 hover:bg-slate-100" title="Reset all demo data">Reset demo</button>
      <button class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center font-medium">M</button>
    </div>
  </div>
</header>

<div class="flex">
  <!-- Left nav -->
  <aside class="w-60 border-r border-slate-200 bg-white min-h-[calc(100vh-3.5rem)] p-3 sticky top-14 self-start">
    <nav id="nav" class="space-y-0.5 text-sm"></nav>
    <div class="mt-6 pt-4 border-t border-slate-100">
      <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 px-3">Cycle progress</div>
      <div class="px-3">
        <div class="flex justify-between text-xs text-slate-600 mb-1"><span>Reviews completed</span><span class="font-medium">3 / 8</span></div>
        <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-indigo-600" style="width: 37.5%"></div></div>
      </div>
    </div>
  </aside>

  <!-- Content -->
  <main class="flex-1 min-w-0">
    <div id="screen" class="max-w-[1400px] mx-auto px-6 py-6"></div>
  </main>
</div>

<!-- Quick capture modal -->
<div id="capture" class="hidden fixed inset-0 bg-slate-900/40 z-50 items-center justify-center">
  <div class="bg-white rounded-xl shadow-2xl w-[560px] p-5">
    <div class="flex justify-between items-start mb-3">
      <div>
        <div class="font-semibold text-base">Quick capture</div>
        <div class="text-xs text-slate-500">Drop an observation now, file it later.</div>
      </div>
      <button onclick="closeCapture()" class="text-slate-400 hover:text-slate-700">✕</button>
    </div>
    <textarea id="capture-text" oninput="updateCaptureChips()" class="w-full border border-slate-200 rounded-md p-3 h-24 text-sm" placeholder="Describe what happened — mention a first name to auto-tag…"></textarea>
    <div id="capture-chips" class="flex gap-2 mt-2 min-h-[26px]"></div>
    <div class="flex justify-between items-center mt-4 pt-3 border-t border-slate-100">
      <span class="text-xs text-slate-500">Auto-files to inbox · ⌘+↵ to save</span>
      <div class="flex gap-2">
        <button onclick="closeCapture()" class="px-3 py-1.5 rounded-md border border-slate-200 text-sm hover:bg-slate-50">Cancel</button>
        <button onclick="saveCapture()" class="px-3 py-1.5 rounded-md bg-indigo-600 text-white text-sm hover:bg-indigo-700">Save to inbox</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-4 py-2.5 rounded-lg shadow-lg z-[60] opacity-0 translate-y-2 transition-all duration-300 pointer-events-none"></div>

<script src="gm/data.js"></script>
<script src="gm/screens-core.js"></script>
<script src="gm/screens-growth.js"></script>
<script src="gm/screens-people.js"></script>
<script src="gm/screens-flow.js"></script>
<script src="gm/screens-settings.js"></script>
<script src="gm/app.js"></script>
</body>
</html>
